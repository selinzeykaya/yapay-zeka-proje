name: Kod kontrolü

# Her push ve PR'da çalışır. Veri, Drive, GEE ve GPU kullanmaz; hiçbir şey eğitmez.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Paketleri kur
        run: pip install -r requirements.txt
      - name: Notebook ve kod kontrolü
        run: python .github/scripts/kontrol.py
